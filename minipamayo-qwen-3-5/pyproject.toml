[project]
name = "minipamayo-qwen-3-5"
version = "0.1.0"
description = "Qwen3.5-native MiniPamayo experiments"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.5.0",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "av>=16.0.1",
    "physical_ai_av>=0.2.0",
    "torch==2.8.0",
    "torchvision>=0.23.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "huggingface-hub==1.8.0",
    "einops>=0.8.1",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "mcap>=1.3.0",
    "wandb>=0.19.0",
    "flash-attn>=2.8.3",
    "transformers==5.4.0",
    "causal-conv1d>=1.6.1",
    "flash-linear-attention>=0.4.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
