[project]
name = "minipamayo-qwen-3-5"
version = "0.1.0"
description = "Qwen3.5-native MiniPamayo experiments"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "av>=16.0.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.34.0",
    "einops>=0.8.1",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "mcap>=1.3.0",
    "wandb>=0.19.0",
    "flash-linear-attention==0.4.2",
    "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.1.post4/causal_conv1d-1.6.1%2Bcu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
    "transformers @ git+https://github.com/huggingface/transformers.git@main",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
