[project]
name = "qwen-vl-mini"
version = "0.1.0"
description = "DINOv2 ViT-B/14 + Qwen2.5-0.5B miniature VLM"
readme = "README.md"
authors = [
    { name = "masahiro-kubota", email = "norikenpi@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "pillow>=10.0.0",
    "huggingface-hub[cli]>=1.4.1",
    "wandb>=0.25.0",
    "datasets>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
