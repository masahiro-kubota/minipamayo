[project]
name = "minipamayo"
version = "0.1.0"
description = "MiniPamayo: Alpamayo-R1 VLA reproduction on RTX 4090"
authors = [
    { name = "masahiro-kubota", email = "norikenpi@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "pillow>=10.0.0",
    "nuscenes-devkit>=1.1.11",
    "pyquaternion>=0.9.9",
    "wandb>=0.25.0",
    "openai>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
