[project]
name = "cosmos-reason-mini"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.37.0",
    "pillow>=10.0.0",
    "nuscenes-devkit>=1.1.11",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "wandb>=0.25.0",
    "qwen-vl-mini",
    "tqdm",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.uv.sources]
qwen-vl-mini = { path = "../qwen-vl-mini", editable = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
